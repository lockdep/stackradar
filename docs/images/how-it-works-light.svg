<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" role="img" aria-label="StackRadar topology in a self-hosted install: the scanner, the client, the server and PostgreSQL all run in your Kubernetes cluster. The scanner watches the pods and reports to the server; the browser reaches the client only; the server pulls OSV.dev, EPSS and CISA KEV, the only traffic that crosses the cluster boundary.">
