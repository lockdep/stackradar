xt><text x="602" y="93" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#9198a1" text-anchor="start">into one number per</text><text x="602" y="108" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#9198a1" text-anchor="start">finding; sums rank images,</text><text x="602" y="123" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#9198a1" text-anchor="start">containers and clusters.</text><clipPath id="sev"><rect x="602" y="151" width="144" height="10" rx="5"/></clipPath><g clip-path="url(#sev)"><rect x="602" y="151" width="22" height="10" fill="#f85149"/><rect x="626" y="151" width="48" height="10" fill="#db6d28"/><rect x="676" y="151" width="44" height="10" fill="#d29922"/><rect x="722" y="151" width="22" height="10" fill="#9198a1"/></g><path d="M760 45 H774" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="780" y="20" width="168" height="164" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1"/><circle cx="805" cy="45" r="11" fill="#4493f8"/><text x="805" y="49" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">5</text><text x="824" y="49.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#f0f6fc" text-anchor="start">Fix</text><circle cx="924" cy="45" r="7.5" fill="none" stroke="#656c76" stroke-width="1.5"/><path d="M924 49 V41 M920.5 44.5 L924 41 L927.5 44.5" fill="none" stroke="#656c76" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="794" y="78" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#9198a1" text-anchor="start">The tag or chart version</text><text x="794" y="93" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#9198a1" text-anchor="start">to move to, what that</text><text x="794" y="108" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#9198a1" text-anchor="start">removes, and the command</text><text x="794" y="123" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#9198a1" text-anchor="start">that does it.</text><rect x="794" y="146" width="148" height="20" rx="5" fill="#161b22" stroke="#3d444d" stroke-width="1"/><text x="868" y="159.42" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace' font-size="9.5" font-weight="400" fill="#9198a1" text-anchor="middle">argocd app sync jenkins</text><path d="M12 200 V206 H372 V200" fill="none" stroke="#3d444d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="192" y="226" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="600" fill="#9198a1" text-anchor="middle">In your cluster · stackradar-scanner</text><path d="M396 200 V206 H948 V200" fill="none" stroke="#3d444d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="672" y="226" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="600" fill="#9198a1" text-anchor="middle">On the server · this repository</text>
