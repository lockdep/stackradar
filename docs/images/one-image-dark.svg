ystem, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#9198a1" text-anchor="start">SBOM; the inventory says</text><text x="218" y="123" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#9198a1" text-anchor="start">where the image runs.</text><rect x="218" y="146" width="142" height="20" rx="5" fill="#161b22" stroke="#3d444d" stroke-width="1"/><text x="289" y="159.42" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace' font-size="9.5" font-weight="400" fill="#9198a1" text-anchor="middle">pkg:npm/express@4.19.2</text><path d="M376 45 H390" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="396" y="20" width="168" height="164" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1"/><circle cx="421" cy="45" r="11" fill="#4493f8"/><text x="421" y="49" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">3</text><text x="440" y="49.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#f0f6fc" text-anchor="start">Match</text><circle cx="538.5" cy="43.5" r="5.5" fill="none" stroke="#656c76" stroke-width="1.5"/><path d="M542.5 47.5 L547.5 52.5" fill="none" stroke="#656c76" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="78" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#9198a1" text-anchor="start">Each package URL is</text><text x="410" y="93" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif