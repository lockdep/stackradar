<svg xmlns="http://www.w3.org/2000/svg" width="960" height="246" viewBox="0 0 960 246" role="img" aria-label="The life of one image: discovered by the read-only agent, inventoried and turned into a CycloneDX SBOM once per digest in your cluster; then matched against the local OSV.dev mirror, scored with CVSS, EPSS and KEV, and given a concrete fix on the server.">
