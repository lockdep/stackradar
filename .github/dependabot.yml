# Dependency updates. Each app is its own pnpm project, and the e2e suite a
# third, so npm runs three times.
# Majors are left to a human in every ecosystem: a Next.js or Drizzle major
# is a migration, not an update. The seven-day cooldown skips releases that
# get yanked in their first week.
# Each entry groups all of its updates into a single pull request per week,
# so a week of dependency updates arrives as one reviewable change per
# ecosystem instead of one pull request per package.
version: 2
updates:
- package-ecosystem: npm
  directory: /server
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  labels: [ "dependencies" ]
  groups:
    server-npm:
      patterns:
      - "*"
  ignore:
  - dependency-name: "*"
    update-types:
    - version-update:semver-major
- package-ecosystem: npm
  directory: /client
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  labels: [ "dependencies" ]
  groups:
    client-npm:
      patterns:
      - "*"
  ignore:
  - dependency-name: "*"
    update-types:
    - version-update:semver-major
- package-ecosystem: npm
  directory: /e2e
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  labels: [ "dependencies" ]
  groups:
    e2e-npm:
      patterns:
      - "*"
  ignore:
  - dependency-name: "*"
    update-types:
    - version-update:semver-major
- package-ecosystem: docker
  directories:
  - /server
  - /client
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  labels: [ "dependencies" ]
  groups:
    docker-images:
      patterns:
      - "*"
  ignore:
  - dependency-name: "*"
    update-types:
    - version-update:semver-major
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  labels: [ "dependencies" ]
  groups:
    github-actions:
      patterns:
      - "*"
