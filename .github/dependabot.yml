# Dependency updates. Each app is its own pnpm project, so npm runs twice.
# Majors are left to a human in every ecosystem: a Next.js or Drizzle major
# is a migration, not an update. The seven-day cooldown skips releases that
# get yanked in their first week.
version: 2
updates:
- package-ecosystem: npm
  directory: /server
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  labels: [ "dependencies" ]
  ignore:
  - dependency-name: "*"
    update-types:
    - version-update:semver-major
- package-ecosystem: npm
  directory: /client
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  labels: [ "dependencies" ]
  ignore:
  - dependency-name: "*"
    update-types:
    - version-update:semver-major
- package-ecosystem: docker
  directories:
  - /server
  - /client
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  labels: [ "dependencies" ]
  ignore:
  - dependency-name: "*"
    update-types:
    - version-update:semver-major
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  labels: [ "dependencies" ]
