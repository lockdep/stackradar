name: Build, Push and Promote App

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "server/**"
      - ".github/workflows/build-push-app.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "client/**"
      - "server/**"
  workflow_dispatch:
    inputs:
      build_client:
        description: "Build and push the client image"
        type: boolean
        default: true
      build_server:
        description: "Build and push the server image"
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: registry.digitalocean.com/stack-radar
  CLIENT_IMAGE: stack-radar-client
  SERVER_IMAGE: stack-radar-server
  # The public images (open-source plan step 07): what the Compose
  # quickstart and the Helm chart pull. This workflow only ever pushes
  # their `:snapshot` tag, the last merge to main, which dev/docker-compose.yml
  # runs. The versioned tags (`:<version>`, `:<major>.<minor>`, `:latest`)
  # are publish.yaml's, built from a release tag for amd64 and arm64 and
  # never rebuilt (RELEASING.md). The same build is pushed to DOCR under its
  # commit sha for the development cluster, which tracks main.
  GHCR_CLIENT_IMAGE: ghcr.io/lockdep/stackradar-client
  GHCR_SERVER_IMAGE: ghcr.io/lockdep/stackradar-server
  YQ_VERSION: v4.53.3

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        # Manual runs pick their targets explicitly, so there is no diff base
        # to filter against.
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'

  build-client:
    needs: detect-changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_client) ||
      needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the public GHCR images
      id-token: write # cosign keyless signing via GitHub Actions OIDC
    # The digest is the promotable identity of this build. Everything
    # downstream pins on it rather than re-deriving a tag, so there is no
    # second place that has to agree about how a tag is spelled.
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        if: github.event_name != 'pull_request'
        run: doctl registry login --expiry-seconds 3600

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Client
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=build-${{ github.run_number }},enable={{is_default_branch}}

      # `:snapshot` only. No branch, PR or build-number tags on GHCR, and no
      # versioned tags: those are publish.yaml's and are immutable once pushed.
      - name: Extract public metadata for Client
        id: ghcr
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_CLIENT_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=snapshot,enable={{is_default_branch}}

      - name: Build and push Client image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./client
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.ghcr.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      # Keyless signing — the certificate binds the image to this workflow at
      # this commit, so there is no signing key to store, rotate, or leak.
      - name: Sign Client image with Cosign (keyless)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign sign --yes "${PUBLIC_IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE }}
          PUBLIC_IMAGE: ${{ env.GHCR_CLIENT_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

  build-server:
    needs: detect-changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_server) ||
      needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    environment: stack-radar
    permissions:
      contents: read
      packages: write # the public GHCR images
      id-token: write # cosign keyless signing via GitHub Actions OIDC
    # The digest is the promotable identity of this build. Everything
    # downstream pins on it rather than re-deriving a tag, so there is no
    # second place that has to agree about how a tag is spelled.
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        if: github.event_name != 'pull_request'
        run: doctl registry login --expiry-seconds 3600

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Server
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=build-${{ github.run_number }},enable={{is_default_branch}}

      # `:snapshot` only. No branch, PR or build-number tags on GHCR, and no
      # versioned tags: those are publish.yaml's and are immutable once pushed.
      - name: Extract public metadata for Server
        id: ghcr
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_SERVER_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=snapshot,enable={{is_default_branch}}

      - name: Build and push Server image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.ghcr.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      # Keyless signing — the certificate binds the image to this workflow at
      # this commit, so there is no signing key to store, rotate, or leak.
      - name: Sign Server image with Cosign (keyless)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign sign --yes "${PUBLIC_IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}
          PUBLIC_IMAGE: ${{ env.GHCR_SERVER_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

  update-manifests:
    needs: [build-client, build-server]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.build-client.result == 'success' || needs.build-server.result == 'success')
    permissions:
      contents: write

    steps:
      - name: Checkout gitops repository
        uses: actions/checkout@v6
        with:
          repository: lockdep/stackradar-gitops-development
          token: ${{ secrets.GITOPS_DEVELOPMENT_TOKEN }}
          path: stackradar-gitops

      - name: Install yq
        run: |
          sudo curl -sSfL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update image tags in gitops repo
        working-directory: stackradar-gitops/apps/stack-radar/overlays/development
        run: |
          set -euo pipefail
          # Kubernetes resolves this by digest; the tag rides along so a human
          # reading the overlay can see which commit is deployed. A digest is
          # content-addressed, so a node's image cache cannot be stale and a
          # repointed tag cannot change what runs.
          #
          # The tag alone was not enough. It used to be build-<run_number>, and
          # run_number is per-workflow-file: it resets to 1 whenever the file is
          # recreated, which this one was on 2026-05-10, after its predecessor
          # had already published build-119. The counter climbed back through
          # tags that already existed, and on 2026-08-12 it reached build-59 and
          # overwrote an image from April. Nodes holding the April build-59 kept
          # serving it - a cached tag is never re-resolved under the
          # imagePullPolicy: IfNotPresent default - so an hourly CronJob ran
          # four-month-old code against a current schema. A commit SHA fixes
          # that particular collision, but SHAs are only immutable by
          # convention: workflow_dispatch and release rebuild commits that
          # already have a SHA tag, and builds are not bit-reproducible. Pinning
          # the digest is the guarantee; the tag is documentation.
          IMAGE_TAG="${GITHUB_SHA::7}"

          # Addresses the images[] entry by name instead of by line position.
          # The previous sed matched `newName:` and blindly rewrote the *next*
          # line, so reordering keys in the kustomization silently corrupted it.
          # yq is used rather than `kustomize edit set image` because the latter
          # reformats the whole file and drops the comment blocks documenting
          # which secrets each environment needs.
          set_image() {
            local name="$1" tag="$2" digest="$3" file=kustomization.yaml

            # An empty digest means build-push-action pushed nothing. Writing it
            # would pin the overlay to `name:tag@` and fail at admission, so
            # stop here instead.
            if [[ -z "$digest" ]]; then
              echo "::error::no digest reported for '${name}' - was the image actually pushed?"
              exit 1
            fi

            yq -i "(.images[] | select(.name == \"${name}\")) |= (.newTag = \"${tag}\" | .digest = \"${digest}\")" "$file"

            # yq is a no-op when the selector matches nothing - verify the write
            # landed rather than pushing an unchanged file.
            local got_tag got_digest
            got_tag="$(yq "(.images[] | select(.name == \"${name}\")).newTag" "$file")"
            got_digest="$(yq "(.images[] | select(.name == \"${name}\")).digest" "$file")"
            if [[ "$got_tag" != "$tag" || "$got_digest" != "$digest" ]]; then
              echo "::error::no images[] entry named '${name}' in ${file} (read back tag '${got_tag}', digest '${got_digest}')"
              exit 1
            fi
            echo "Updated ${name} to ${tag}@${digest}"
          }

          if [[ "${{ needs.build-client.result }}" == "success" ]]; then
            set_image "stack-radar/client" "$IMAGE_TAG" "${{ needs.build-client.outputs.digest }}"
          fi

          if [[ "${{ needs.build-server.result }}" == "success" ]]; then
            set_image "stack-radar/server" "$IMAGE_TAG" "${{ needs.build-server.outputs.digest }}"
          fi

      - name: Commit and push to gitops repo
        run: |
          cd stackradar-gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/stack-radar/overlays/development/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: update images to ${GITHUB_SHA::7}"
          git push
