name: Dead Exports (knip)

# Each app carries a knip.json tuned to its shape (Next.js app-router entries
# for the client, package.json script entries for the server's worker and
# sync CLIs; `ignoreExportsUsedInFile` because neither app is a library).
# A knip finding is an export, file or dependency nothing references — the
# refactor debt this repo just paid down once; this job keeps it paid.

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/dead-exports.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knip:
    name: "knip (${{ matrix.app }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # No `version`: pnpm/action-setup reads the app's `packageManager`
      # field, so the lockfile and the CI pnpm never disagree.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ matrix.app }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for dead exports
        run: pnpm knip
