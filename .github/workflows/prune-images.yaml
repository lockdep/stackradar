# Prune what snapshot builds leave behind in GHCR.
#
# Every merge to main moves `:snapshot` (snapshot.yaml) and strands the
# previous index, its children and its cosign signature as versions nothing
# references. This runs scripts/ghcr-prune.mjs weekly: it walks the registry
# from the real tags (releases, `:snapshot`) through index children and
# signature subjects and deletes only what is unreachable and older than the
# window. Released versions always keep their tag (RELEASING.md), so nothing
# of theirs is ever a candidate.
#
# A manual run is a dry run unless told otherwise: it prints the keep/prune
# verdict per version and deletes nothing.
name: Prune images

on:
  schedule:
    # Sundays 04:00 UTC: a quiet hour, after the week's merges and before
    # Monday's. The window is two weeks, so a weekly pass is plenty.
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be deleted"
        type: boolean
        default: true
      keep_days:
        description: "Keep every version younger than this, referenced or not"
        type: string
        default: "14"

permissions:
  contents: read

jobs:
  prune:
    name: prune unreachable image versions
    runs-on: ubuntu-latest
    # A fork has its own packages or none; the script treats a missing
    # package as nothing to do, but there is no reason to spend the run.
    if: github.repository == 'lockdep/stackradar'
    permissions:
      contents: read
      packages: write # deleting a version of a package this repository administers
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Prune
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          KEEP_DAYS: ${{ inputs.keep_days || '14' }}
        run: |
          set -euo pipefail
          args=(--keep-days "${KEEP_DAYS}")
          [[ "${DRY_RUN}" == "true" ]] || args+=(--delete)
          node scripts/ghcr-prune.mjs "${args[@]}" stackradar-server stackradar-client
