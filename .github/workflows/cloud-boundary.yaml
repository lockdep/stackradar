name: Cloud Boundary

# `server/src/cloud/` and `client/src/cloud/` are source-available under the
# StackRadar Cloud Licence; the rest of the repository is AGPL-3.0-only. The
# script checks that every file under a cloud directory carries the SPDX
# header and nothing outside does, that each cloud directory has its
# LICENSE, and that the AGPL core imports the cloud only at the designated
# mount points (`edition.isCloud` gates). Dependency-free.

on:
  pull_request:
    branches: [main]
    paths:
      - "server/src/**"
      - "server/tests/**"
      - "client/src/**"
      - "scripts/check-cloud-boundary.mjs"
      - ".github/workflows/cloud-boundary.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: "check-cloud-boundary"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check the licence boundary
        run: node scripts/check-cloud-boundary.mjs
