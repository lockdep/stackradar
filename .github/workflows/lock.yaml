name: Lock Threads

# Closed issues and pull requests are locked after 30 days without
# activity, so a "me too" on a three-year-old thread becomes a new issue
# with a current version and a current reproduction instead.

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions: { }

jobs:
  action:
    runs-on: ubuntu-latest
    permissions:
      issues: write # Required to lock issues
      pull-requests: write # Required to lock PRs
    # don't run on forks
    if: ${{ contains(github.repository, 'lockdep/') }}
    steps:
      - uses: dessant/lock-threads@7266a7ce5c1df01b1c6db85bf8cd86c737dadbe7 # tag=v6.0.0
        with:
          github-token: ${{ github.token }}
          issue-inactive-days: '30'
          exclude-issue-created-before: ''
          exclude-any-issue-labels: ''
          add-issue-labels: ''
          issue-comment: 'This thread has been automatically locked since there has not been any recent activity after it was closed. Please open a new issue for related defects.'
          issue-lock-reason: 'resolved'
          pr-inactive-days: '30'
          exclude-pr-created-before: ''
          exclude-any-pr-labels: ''
          add-pr-labels: ''
          pr-comment: ''
          pr-lock-reason: 'resolved'
          process-only: ''
