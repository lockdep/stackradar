# Production promotion.
#
# Production runs releases. This workflow takes a version that publish.yaml
# has published, resolves the digests of ghcr.io/lockdep/stackradar-server
# and -client at that version, verifies their cosign signatures against the
# publish workflow's identity, and opens a PR on lockdep/stackradar-gitops
# that pins apps/stack-radar/overlays/production to them. Merging the PR is
# the deploy; the prod cluster's ArgoCD does the rest.
#
# Until open-source plan step 14 this copied whatever development was pinned
# to - a per-commit build of main - into production. That guaranteed prod
# ran bytes dev had run, but those bytes were an ad hoc build nobody else
# could pull or verify. Now a cloud deploy is always of a published, signed,
# SBOM'd release: the same image a self-hoster installs, and the same digest
# the GitHub Release lists. Development keeps tracking main through
# build-push-app.yaml, so a release has already run there in substance; the
# release build itself is a separate build of the tagged commit.
#
# It still promotes an artifact, not a tag: the overlay is pinned by digest,
# so a tag repointed under it cannot change what runs (the 2026-08-12
# incident: a reused mutable tag served four-month-old code because a cached
# tag is never re-resolved). The tag rides along for the human reading the
# overlay.
#
# Required secrets:
#   GITOPS_PROD_TOKEN - PAT with contents:write AND pull-requests:write on
#                       lockdep/stackradar-gitops
name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published release to promote, e.g. 0.2.0 (the tag without its v)"
        type: string
        required: true

permissions:
  contents: read

env:
  SERVER_IMAGE: ghcr.io/lockdep/stackradar-server
  CLIENT_IMAGE: ghcr.io/lockdep/stackradar-client
  YQ_VERSION: v4.53.3
  KUSTOMIZE_VERSION: v5.8.1

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the version
        id: version
        env:
          INPUT: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${INPUT#v}"
          if ! printf '%s' "${version}" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::'${INPUT}' is not a stable x.y.z version. Prereleases are tried on development, not promoted."
            exit 1
          fi

          # The release must exist and be published: a draft means publish.yaml
          # has not finished (or failed) and the images may be half there.
          draft="$(gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ -z "${draft}" ]]; then
            echo "::error::No GitHub Release v${version} in ${GITHUB_REPOSITORY}. Release it first (RELEASING.md)."
            exit 1
          fi
          if [[ "${draft}" == "true" ]]; then
            echo "::error::Release v${version} is still a draft: publish.yaml has not finished. Wait for it, or look at why it failed."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install yq and kustomize
        run: |
          sudo curl -sSfL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize
          yq --version
          kustomize version

      # The digest is resolved from the registry, never typed: production is
      # pinned to the bytes `:<version>` names today, and ArgoCD would report
      # Healthy right up until ImagePullBackOff if the tag did not exist.
      - name: Resolve the release digests
        id: images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          resolve() {
            local image="$1" digest
            digest="$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{.Manifest.Digest}}')"
            if [[ -z "${digest}" || "${digest}" == "null" ]]; then
              echo "::error::${image}:${VERSION} is not in the registry." >&2
              return 1
            fi
            printf '%s' "${digest}"
          }
          SERVER_DIGEST="$(resolve "${SERVER_IMAGE}")"
          CLIENT_DIGEST="$(resolve "${CLIENT_IMAGE}")"
          {
            echo "server_digest=${SERVER_DIGEST}"
            echo "client_digest=${CLIENT_DIGEST}"
          } >> "$GITHUB_OUTPUT"
          echo "server: ${SERVER_IMAGE}:${VERSION}@${SERVER_DIGEST}"
          echo "client: ${CLIENT_IMAGE}:${VERSION}@${CLIENT_DIGEST}"

      # Only an image publish.yaml signed at this exact tag is promotable. A
      # digest that fails this was pushed some other way, whatever its tag says.
      - name: Verify the cosign signatures
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SERVER_DIGEST: ${{ steps.images.outputs.server_digest }}
          CLIENT_DIGEST: ${{ steps.images.outputs.client_digest }}
        run: |
          set -euo pipefail
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yaml@refs/tags/v${VERSION}$"
          for ref in "${SERVER_IMAGE}@${SERVER_DIGEST}" "${CLIENT_IMAGE}@${CLIENT_DIGEST}"; do
            cosign verify \
              --certificate-identity-regexp "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${ref}" > /dev/null
            echo "verified: ${ref}"
          done

      - name: Checkout prod gitops repository (promotion target)
        uses: actions/checkout@v6
        with:
          repository: lockdep/stackradar-gitops
          token: ${{ secrets.GITOPS_PROD_TOKEN }}
          path: stackradar-gitops-prod

      - name: Bump the production overlay
        working-directory: stackradar-gitops-prod/apps/stack-radar/overlays/production
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SERVER_DIGEST: ${{ steps.images.outputs.server_digest }}
          CLIENT_DIGEST: ${{ steps.images.outputs.client_digest }}
        run: |
          set -euo pipefail

          # yq rather than `kustomize edit set image`: the latter reformats the
          # whole kustomization and drops the comment block documenting which
          # secrets production needs. newName moves to GHCR with the first
          # promotion after step 14; the base keeps its registry-neutral name.
          set_image() {
            local name="$1" new_name="$2" tag="$3" digest="$4" file=kustomization.yaml
            yq -i "(.images[] | select(.name == \"${name}\")) |= (.newName = \"${new_name}\" | .newTag = \"${tag}\" | .digest = \"${digest}\")" "$file"

            # yq is a no-op when the selector matches nothing - verify the write
            # landed rather than opening a PR that changes nothing.
            local got_name got_tag got_digest
            got_name="$(yq "(.images[] | select(.name == \"${name}\")).newName" "$file")"
            got_tag="$(yq "(.images[] | select(.name == \"${name}\")).newTag" "$file")"
            got_digest="$(yq "(.images[] | select(.name == \"${name}\")).digest" "$file")"
            if [[ "$got_name" != "$new_name" || "$got_tag" != "$tag" || "$got_digest" != "$digest" ]]; then
              echo "::error::no images[] entry named '${name}' in ${file} (read back '${got_name}:${got_tag}@${got_digest}')"
              exit 1
            fi
            echo "Set ${name} to ${new_name}:${tag}@${digest}"
          }

          set_image "stack-radar/client" "${CLIENT_IMAGE}" "${VERSION}" "${CLIENT_DIGEST}"
          set_image "stack-radar/server" "${SERVER_IMAGE}" "${VERSION}" "${SERVER_DIGEST}"

      - name: Render the overlay to prove it still builds
        working-directory: stackradar-gitops-prod
        run: kustomize build apps/stack-radar/overlays/production > /dev/null

      - name: Open promotion PR
        working-directory: stackradar-gitops-prod
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PROD_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SERVER_DIGEST: ${{ steps.images.outputs.server_digest }}
          CLIENT_DIGEST: ${{ steps.images.outputs.client_digest }}
        run: |
          set -euo pipefail
          BRANCH="promote/v${VERSION}"

          if git diff --quiet; then
            echo "Production already runs ${VERSION}; nothing to promote."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add apps/stack-radar/overlays/production/kustomization.yaml
          git commit -m "promote StackRadar ${VERSION} to production"
          git push origin "$BRANCH"

          gh pr create \
            --repo lockdep/stackradar-gitops \
            --base main \
            --head "$BRANCH" \
            --title "Promote StackRadar ${VERSION} to production" \
            --body "$(cat <<EOF
          Pins the production overlay to the published release [v${VERSION}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}).

          | image | tag | digest |
          |---|---|---|
          | \`${CLIENT_IMAGE}\` | \`${VERSION}\` | \`${CLIENT_DIGEST}\` |
          | \`${SERVER_IMAGE}\` | \`${VERSION}\` | \`${SERVER_DIGEST}\` |

          Both digests were resolved from GHCR and their cosign signatures verified against
          \`publish.yaml@refs/tags/v${VERSION}\` before this PR was opened. The release notes say
          whether this version carries a schema migration; if it does, the migration Job runs it on sync.

          Pinned by digest, so production runs exactly the bytes the release lists - not a rebuild,
          and not whatever a tag happens to point at by the time ArgoCD syncs.

          Merging this deploys to production once \`stack-radar-prod\` has automated sync enabled - until then, sync it manually in the prod cluster's ArgoCD after merging.

          Triggered from [${{ github.workflow }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          EOF
          )"
