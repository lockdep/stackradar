name: CodeQL

# Static analysis of the TypeScript in both apps. Trivy in publish.yaml scans
# the built images for known CVEs in dependencies; this is the complement,
# the code we write. Free on public repositories, so there is no reason not
# to have it. Findings land under Security → Code scanning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tuesdays 05:00 UTC, so a query-pack update that finds something in
    # unchanged code is still noticed.
    - cron: "0 5 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    # Code scanning is free on public repositories only; on a private one it
    # needs Advanced Security and the upload fails. Skip rather than fail,
    # so the job turns on by itself when the repository goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # The action reads its own workflow run for incremental analysis;
      # without this it fails with "Resource not accessible by integration".
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          # Both apps, no node_modules, no generated Drizzle metadata.
          config: |
            paths:
              - server/src
              - client/src
            paths-ignore:
              - "**/*.test.ts"
              - "**/*.test.tsx"
            # `js/missing-rate-limiting` flags every authenticated Express
            # handler with no limiter it knows (express-rate-limit, express-brute,
            # express-limiter, rate-limiter-flexible) in front of it. Ours it
            # cannot see: the `/v1` ingest routes sit behind the per-key token
            # bucket in `middleware/rate-limit.ts`, and the `/api` surface is
            # cluster-only (the Next.js BFF is its one caller), where flooding
            # is the Ingress's job (`limit-rps`; docs/self-hosting/helm.md,
            # "Ingest rate limits and replicas"). Every one of its 80-odd
            # findings was dismissed as won't fix, and renaming a route file
            # raised them again as new, so the query is off rather than
            # re-dismissed each time.
            query-filters:
              - exclude:
                  id: js/missing-rate-limiting

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:javascript-typescript"
