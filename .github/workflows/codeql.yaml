name: CodeQL

# Static analysis of the TypeScript in both apps. Trivy in publish.yaml scans
# the built images for known CVEs in dependencies; this is the complement,
# the code we write. Free on public repositories, so there is no reason not
# to have it. Findings land under Security → Code scanning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tuesdays 05:00 UTC, so a query-pack update that finds something in
    # unchanged code is still noticed.
    - cron: "0 5 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    # Code scanning is free on public repositories only; on a private one it
    # needs Advanced Security and the upload fails. Skip rather than fail,
    # so the job turns on by itself when the repository goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # The action reads its own workflow run for incremental analysis;
      # without this it fails with "Resource not accessible by integration".
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Both apps, no node_modules, no generated Drizzle metadata.
          config: |
            paths:
              - server/src
              - client/src
            paths-ignore:
              - "**/*.test.ts"
              - "**/*.test.tsx"

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
