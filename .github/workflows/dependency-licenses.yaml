name: Dependency Licences

# The two apps are AGPL-3.0-only and their images ship every runtime
# dependency, so a dependency under an incompatible or missing licence is a
# defect in the release, not a footnote. scripts/check-dependency-licenses.mjs
# reads the licence pnpm reports for each runtime package and fails on any
# expression outside its allow-list (or any package without one). It runs
# when a lockfile or manifest changes, which is the only time the answer
# can change.

on:
  pull_request:
    branches: [main]
    paths:
      - "server/package.json"
      - "server/pnpm-lock.yaml"
      - "client/package.json"
      - "client/pnpm-lock.yaml"
      - "scripts/check-dependency-licenses.mjs"
      - ".github/workflows/dependency-licenses.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: "licences (${{ matrix.app }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [server, client]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # No `version`: pnpm/action-setup reads the app's `packageManager`
      # field, so the lockfile and the CI pnpm never disagree.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ matrix.app }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: pnpm install --frozen-lockfile

      - name: Check runtime dependency licences
        run: node scripts/check-dependency-licenses.mjs ${{ matrix.app }}
